spring.application.name=CrudService
server.port=8081

# PostgreSQL: create this database in pgAdmin / psql first.
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_2400030139
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=CrudService
info.app.description=Cafeteria CRUD Service
info.app.version=1.0
